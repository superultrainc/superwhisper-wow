name: Windows
on: [push, pull_request]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Build and test the Windows companion
        shell: powershell
        run: ./windows/tests/unit.ps1
      - name: Exercise the packaged executable against a foreground Wow.exe
        shell: powershell
        run: ./windows/tests/desktop.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-desktop-proof
          path: windows/dist/proof/windows-chat.png
          if-no-files-found: error
